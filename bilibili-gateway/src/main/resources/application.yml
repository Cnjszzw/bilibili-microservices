server:
  port: 8000

spring:
  application:
    name: bilibili-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "*"
            maxAge: 3600
      routes:
        # ===== Content Service（Phase 2）=====
        - id: content-video
          uri: lb://bilibili-content-service
          predicates:
            - Path=/videos/**, /video-slices/**, /video-slices-simple/**, /video-likes/**, /video-collections/**, /video-coins/**, /video-comments/**, /video-details/**, /video-views/**, /video-view-counts/**, /video-triple-clicks/**, /viewImage/**
        - id: content-file
          uri: lb://bilibili-content-service
          predicates:
            - Path=/md5files/**, /file-slices/**
        - id: content-tag
          uri: lb://bilibili-content-service
          predicates:
            - Path=/contents/**, /tags/**
        # ===== Legacy 单体应用（兜底路由）=====
        - id: bilibili-legacy-service
          uri: lb://bilibili-legacy-service
          predicates:
            - Path=/**
          filters:
            - StripPrefix=0

logging:
  level:
    org.springframework.cloud.gateway: debug
